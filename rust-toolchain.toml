[toolchain]
channel = "stable"
# dth30-core builds the DTH30 series firmware (crates/dth30-fw) for the chip's MIPS
# core, for which `core` has to be built from source.
components = ["rust-src"]
targets = [
    "x86_64-pc-windows-msvc",
    "i686-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-musl",
    "i686-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "armv7-unknown-linux-musleabihf",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
