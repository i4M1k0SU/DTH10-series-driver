[workspace]
resolver = "3"
members = [
    "crates/dth10-core",
    "crates/dth10-usb",
    "crates/dth10-diag",
    "crates/dth10-tuner",
    "crates/dth10-cli",
    "crates/dth10-bondriver",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = ""

[workspace.dependencies]
dth10-core = { path = "crates/dth10-core" }
dth10-usb = { path = "crates/dth10-usb" }
dth10-tuner = { path = "crates/dth10-tuner" }
nusb = "0.2"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.6.7", features = ["derive"] }
winresource = "0.1.34"
jiff = { version = "0.2", default-features = false, features = ["std"] }

# Whole-program optimisation for the shipped binaries (the daemon's TS
# decryption and the DLL's stream copy are the hot paths); the build takes
# longer, the tests use the dev profile as before.
[profile.release]
lto = "fat"
codegen-units = 1
