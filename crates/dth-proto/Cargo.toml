[package]
name = "dth-proto"
description = "The request/reply lines between the tuner daemon and its clients (the stream command, the BonDriver) and the socket they travel on"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dth-common.workspace = true
socket2 = "0.6.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
