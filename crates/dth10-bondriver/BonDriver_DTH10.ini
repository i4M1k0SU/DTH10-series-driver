; BonDriver_DTH10.ini
; BonDriver_DTH10.dll と同じフォルダに置く (無くても既定値で動作)。DLL をリネームして使うときは ini もその名前に合わせる (<DLL 名>.ini)。
; 値は 10 進または 0x 付き 16 進。真偽値は 1/0, true/false, yes/no, on/off。

[Device]
; 複数台接続時に、この DLL で扱う機器を USB シリアル番号で指定する。複数台接続時は必ず指定する (未指定では動作しない)。1 台のみであれば空でよい
; `dth10 list` コマンドで、接続されている機器の USB シリアル番号を確認できる
; DT-H30/U2 系 (DT-H50/U2 など) は USB シリアル番号を持たないため、`dth10 list` に表示されるユニット名 (例 DTH30-0129) を指定する
Serial=
; この DLL が TVTest に見せるチューニング空間。GR / BS / CS をカンマ区切りで表記。 (空: GR,BS,CS (全て))
; 地デジ用と BS/CS 用に DLL をリネームして 2 つ置き、それぞれの ini で GR と BS,CS に分けると、 2 つの TVTest で同時に視聴できる
; DT-H30/U2 系は地デジのみなので GR を指定する
Spaces=
; 地デジチューナーを 2 つ持つモデル (DT-F200/U2W など) で使う地デジチューナー。 0 / 1 / auto (空いている方)。他のモデルは常に 0 (空: auto)
; DLL をリネームして 2 つ置き、それぞれの ini で 0 と 1 に分けてもよい
Tuner=

[Stream]
; raw    : 復調器出力そのままのスクランブルされたフル TS (PSI 平文・ES は放送の MULTI2 のまま) を取得する。TVTest 側の B-CAS リーダーで復号する (地デジ専用)
; device : デバイス内蔵 B-CAS リーダーで復号して取得する (純正アプリ PCastTV3 の CoBDACom.dll をこの DLL と同じフォルダに置く。本 DLL には含まれない)
; BS/CS はこの設定によらず device で動く。地デジを raw で一度流すと、電源を入れ直すまで BS/CS の選局でデバイスが停止する問題 (仕様？) がある。既定は device (空: device)
; DT-H30/U2 系の device は機器内蔵の B-CAS カードで復号した 1 番組の TS になる (CoBDACom.dll は不要。代わりに純正ドライバの BufFsUSB.sys をこの DLL と同じフォルダに置く)
Mode=device
; device モードでデバイスに送る番組 (PID リストは 1 番組分しか保持されない)
; first  : PAT の先頭番組
; all    : 全番組を順に送る (最後の番組が有効)
; [数値] : サービス ID (例 0x400)
Program=first

[ISDB-T]
; 選局後、ストリーム開始前にロックを待つ最大時間 [ms] (時間内にロックしなくても信号があれば最大 2 秒延ばす)
LockWaitMs=1200
; アッテネータ (受信信号の減衰)。電波が強すぎるときに使う。アッテネータのあるモデル向けの設定。既定は OFF
Attenuator=0

[ISDB-S]
; アンテナ (LNB) 給電。給電機能のあるモデル向けの設定。既定は OFF
LnbPower=0
; アンテナ (LNB) 給電の電圧。 0 / 110 (11 V) / 150 (15 V)
LnbVoltage=150
; ブースター。ブースターのあるモデル向けの設定 (アンテナ給電とは別)。既定は OFF
Booster=0
; 同調後にロックを待つ最大時間 [ms] (TS-ID 表の取得に使う。信号があれば最大 2 秒延ばす)
LockWaitMs=1500

[Log]
; error | warn | info | debug | trace
Level=warn
; ログを記録するファイルパス。 (空: ログ機能を無効にする)
File=

[Server]
; TVTestを終了してから dth10.exe を終了するまでの秒数 (0: 終わらない)
IdleExitSec=5
; BonDriver 起動後、 dth10.exe の応答待ち時間
StartTimeoutSec=5
