[package]
name = "dth10-bondriver"
description = "BonDriver (IBonDriver2) DLL for the BUFFALO DTH10 series of USB TV tuners (verified on a DT-H70/U2), built on dth10-core / dth10-usb"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "BonDriver_DTH10"
crate-type = ["cdylib"]

[dependencies]
dth10-core.workspace = true
dth10-usb.workspace = true
dth10-tuner.workspace = true
log.workspace = true
env_logger.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_WindowsProgramming"] }

[features]
# `cargo test --features rtti-check`: a C++ test (tests/rtti_check.cpp, built
# with the host's MSVC by build.rs) runs a real dynamic_cast<IBonDriver2*> on
# the object from CreateBonDriver. Off by default: a plain build needs no C++.
rtti-check = []

[build-dependencies]
cc = "1"
